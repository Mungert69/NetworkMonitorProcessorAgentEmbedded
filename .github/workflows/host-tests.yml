name: Host tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake libbrotli-dev libssl-dev
      - name: Check whitespace
        run: |
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          elif [[ "${{ github.event_name }}" == push ]]; then
            git diff --check "${{ github.event.before }}...${{ github.sha }}"
          else
            git diff --check HEAD^ HEAD
          fi
      - name: Configure
        run: cmake -S . -B build-tests -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
      - name: Build
        run: cmake --build build-tests -j 2
      - name: Test
        run: ctest --test-dir build-tests --output-on-failure
      - name: Tooling tests
        run: python3 -m unittest discover -s tests/tooling
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Mungert69/NetworkMonitorLib
          path: NetworkMonitorLib
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.112
      - name: Verify .NET-derived fixtures
        env:
          NETWORK_MONITOR_LIB_ROOT: ${{ github.workspace }}/NetworkMonitorLib
        run: bash tests/dotnet/generate.sh --check-compatible
  firmware-and-brotli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install pinned ESP-IDF toolchain
        uses: espressif/install-esp-idf-action@8fc05d1470d5591417e7a3707a1f2bec178db4ae # v1 branch commit
        with:
          version: v6.1
      - name: Build with disposable CI-only signing key
        working-directory: firmware
        run: |
          umask 077
          espsecure.py generate_signing_key --version 2 private-ota-signing-key.pem
          idf.py -D SDKCONFIG=sdkconfig.production build
          test -s build/networkmonitor_processor_esp32.bin
          app_bytes=$(stat -c %s build/networkmonitor_processor_esp32.bin)
          test "$app_bytes" -le $((0x600000))
          echo "Signed application: $app_bytes / $((0x600000)) bytes"
      - name: Run specialized Brotli tests
        # The ESP-IDF installer prepends the Xtensa toolchain to PATH. These
        # are host tests; force the runner's native compiler and assembler.
        run: |
          clean_env() { env -i PATH=/usr/bin:/bin HOME="$HOME" "$@"; }
          clean_env cmake -S . -B build-q0-tests -DNM_TEST_BROTLI_Q0=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS='-Os -fsanitize=address,undefined -fno-omit-frame-pointer'
          clean_env cmake --build build-q0-tests -j 2
          clean_env ctest --test-dir build-q0-tests --output-on-failure
