name: Firmware dependency update check

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check pinned firmware dependencies for updates
        id: check
        continue-on-error: true
        run: python3 tools/check-component-updates.py
      - name: Open or update tracking issue when review is needed
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Review firmware dependency updates'
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$title in:title" --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh issue create --title "$title" \
              --body 'The scheduled check found a newer stable firmware dependency release or could not reach an upstream source. This includes Brotli, ESP-MQTT, yyjson, and wolfSSL. Run `python3 tools/check-component-updates.py`. Review security advisories and release notes, update the exact pin in a pull request, regenerate the IDF lockfile if applicable, and require CI to pass before merging.' \
              --repo "$GITHUB_REPOSITORY"
          fi
          exit 1
